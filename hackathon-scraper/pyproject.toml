[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ph-hackathon-scraper"
version = "1.0.0"
description = "Find hackathons open to Philippine teams, ranked by prize pool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
phhack = "phhack.cli:main"

[tool.setuptools.packages.find]
include = ["phhack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
